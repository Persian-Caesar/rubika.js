name: Publish to npmjs.org & GitHub Packages

on:
  release:
    types: released

  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
        continue-on-error: true

      - name: Build package
        run: npm run build
        continue-on-error: true

      - name: Configure authentication for npmjs and GitHub Packages
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
          echo "@persian-caesar:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PACKAGES_TOKEN }}" >> ~/.npmrc

      - name: Setup Node.js for npmjs
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org/"

      - name: Publish to npmjs.org
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

        continue-on-error: true

      # ==================================================
      # Prepare package for GitHub Packages
      # ==================================================

      - name: Save original package name
        run: |
          jq -r '.name' package.json > original_name.txt

      - name: Change package name for GitHub Packages
        run: |
          jq '.name = "@persian-caesar/rubika.js"' package.json > temp_package.json
          mv temp_package.json package.json

      # ==================================================
      # Publish to GitHub Packages
      # ==================================================

      - name: Setup GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com/"
          scope: "@persian-caesar"
          package-manager-cache: false

      - name: Publish to GitHub Packages
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

        continue-on-error: true
